<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing del Equipo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
    }
    header, section, footer {
      padding: 40px;
      text-align: center;
    }
    header {
      background: #222;
      color: #fff;
    }
    .integrantes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 200px;
      padding: 15px;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .tecnologias {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tag {
      background: #eee;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    footer {
      background: #222;
      color: #fff;
    }
    footer a {
      color: #0ff;
      margin: 0 10px;
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .integrantes {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- HU-1 Encabezado -->
  <header>
    <h1>Nombre del Equipo</h1>
    <p>Lema inspirador del equipo</p>
  </header>

  <!-- HU-2 Integrantes -->
  <section>
    <h2>Conoce al equipo</h2>
    <div class="integrantes">
      <div class="card">
        <img src="foto1.jpg" alt="Integrante 1">
        <h3>Nombre 1</h3>
        <p>Rol</p>
      </div>
      <div class="card">
        <img src="foto2.jpg" alt="Integrante 2">
        <h3>Nombre 2</h3>
        <p>Rol</p>
      </div>
      <!-- Agregar más tarjetas según integrantes -->
    </div>
  </section>

  <!-- HU-3 Qué hacemos -->
  <section>
    <h2>Nuestro proyecto</h2>
    <p>Breve descripción del proyecto del equipo.</p>
    <div class="tecnologias">
      <span class="tag">HTML</span>
      <span class="tag">CSS</span>
      <span class="tag">JavaScript</span>
      <!-- Agregar más tecnologías -->
    </div>
  </section>

  <!-- HU-4 Contacto -->
  <footer>
    <p>Contáctanos:</p>
    <a href="https://github.com/tu-equipo" target="_blank">GitHub</a>
    <a href="mailto:equipo@correo.com">Correo</a>
  </footer>

</body>
</html>

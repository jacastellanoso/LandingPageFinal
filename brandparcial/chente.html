<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Chente</title>
    <style>
        @font-face {
            font-family: "Product Sans Local";
            src: local("Product Sans"), local("ProductSans-Regular");
            font-style: normal;
            font-weight: 400;
        }

        @font-face {
            font-family: "Product Sans Local";
            src: local("Product Sans Medium"), local("ProductSans-Medium");
            font-style: normal;
            font-weight: 500;
        }

        :root {
            --fuente-comedor: "Product Sans Local", Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 2.5rem);
            background-color: #5f0403;
        }

        .chente-grid {
            width: min(100%, 62rem);
            margin-inline: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr));
            gap: clamp(1rem, 3vw, 2rem);
            align-items: center;
        }

        .chente-card {
            min-width: 0;
            display: grid;
            place-items: center;
        }

        .chente-card__id {
            color: #fdffed;
            font-family: var(--fuente-comedor);
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.4;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .chente-card__image {
            display: block;
            width: min(100%, 11.25rem);
            height: auto;
        }

        @media (max-width: 30rem) {
            .chente-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.75rem;
            }
        }
    </style>
</head>

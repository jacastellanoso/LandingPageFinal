  <style>
    @font-face {
      font-family: "Product Sans Local";
      src: local("Product Sans"), local("ProductSans-Regular");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Product Sans Local";
      src: local("Product Sans Medium"), local("ProductSans-Medium");
      font-style: normal;
      font-weight: 500;
    }

    :root {
      --vino: #5f0403;
      --claro: #fdffed;
      --blanco: #ffffff;
      --fuente: "Product Sans Local", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(1rem, 4vw, 3rem);
      background: var(--vino);
      color: var(--claro);
      font-family: var(--fuente);
    }

    .encabezado {
      width: min(100%, 72rem);
      margin: 0 auto clamp(1.5rem, 4vw, 2.5rem);
      text-align: center;
    }

    .encabezado h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.75rem);
      line-height: 1.1;
    }

    .encabezado p {
      max-width: 42rem;
      margin: 0.65rem auto 0;
      font-size: clamp(0.9rem, 2vw, 1rem);
      line-height: 1.5;
      opacity: 0.82;
    }

    .galeria {
      width: min(100%, 72rem);
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));
      gap: clamp(0.75rem, 2vw, 1.25rem);
    }

    .icono-card {
      min-width: 0;
      margin: 0;
      padding: 1rem 0.75rem 0.8rem;
      display: grid;
      place-items: center;
      gap: 0.65rem;
      border: 1px solid rgb(253 255 237 / 18%);
      border-radius: 1.25rem;
      background: rgb(253 255 237 / 6%);
    }

    .icono-card svg {
      display: block;
      width: clamp(4rem, 9vw, 5.25rem);
      height: auto;
      overflow: visible;
    }

    .icono-card figcaption {
      max-width: 100%;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.25;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .icono-sticker {
      fill: none;
      stroke: var(--blanco);
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .relleno-claro {
      fill: var(--blanco);
    }

    @media (max-width: 30rem) {
      .galeria {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .icono-card {
        padding-inline: 0.5rem;
      }
    }
  </style>
</head>

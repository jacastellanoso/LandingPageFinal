<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Presentación animada de Comedor La Placita.">
  <title>Comedor La Placita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:"Product Sans Local";src:local("Product Sans"),local("ProductSans-Regular");font-style:normal;font-weight:400}
    :root{--vino:#5f0403;--claro:#fdffed;--duracion:9s;--loader-size:clamp(2.75rem,7vw,3.5rem);--loader-step:.8s;--loader-cycle:6.4s;--comedor:"Product Sans Local",Arial,sans-serif;--placita:"Luckiest Guy",sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;min-width:320px;min-height:100%;margin:0;background:var(--vino);overflow:hidden}
    body{font-family:var(--comedor)}
    .intro{position:relative;width:100%;min-height:100svh;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden}
    .escena{position:relative;width:min(94vw,44rem,96.19svh);aspect-ratio:44/43;flex:none}
    .visual{position:absolute;inset:0;z-index:1;pointer-events:none}
    .chentes{position:absolute;left:50%;top:18%;width:38.64%;aspect-ratio:119/141;translate:-50% -9%;z-index:3;animation:ocultar-chentes var(--duracion) ease both}
    .chente{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform-origin:50% 60%;will-change:opacity,transform}
    .chente--1{animation:chente-1 var(--duracion) ease both}.chente--2{animation:chente-2 var(--duracion) ease both}.chente--3{animation:chente-3 var(--duracion) ease both}.chente--4{animation:chente-4 var(--duracion) ease both}.chente--5{animation:chente-final var(--duracion) cubic-bezier(.4,0,.2,1) both}
    .marca{position:absolute;left:50%;top:50%;width:97.73%;translate:-50% -50%;z-index:5;overflow:visible;pointer-events:none;animation:acomodar-marca var(--duracion) cubic-bezier(.22,.8,.24,1) both}
    .marca::before{content:"";position:absolute;z-index:0;left:-5vw;right:-5vw;top:calc(55% + clamp(.65rem,1.8vh,1.1rem));height:100vh;background:var(--vino);visibility:hidden;animation:activar-oclusor var(--duracion) step-start both}
    .logo{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible;color:var(--claro)}
    .logo__comedor{fill:currentColor;font-family:var(--comedor);font-size:74px;font-style:normal;font-weight:400;opacity:0;animation:mostrar-comedor var(--duracion) cubic-bezier(.22,.8,.24,1) both}
    .logo__placita{opacity:0;transform-box:fill-box;transform-origin:50% 50%;will-change:opacity,transform;animation:mostrar-placita var(--duracion) cubic-bezier(.18,.9,.25,1) both}
    .logo__letra{font-family:var(--placita);font-size:144px;font-style:normal;font-weight:400;text-anchor:middle}
    .logo-outline .logo__letra{fill:var(--claro);stroke:var(--claro);stroke-width:28px;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke fill}
    .logo-fill .logo__letra{fill:var(--vino);stroke:none}
    .mensajes{position:absolute;left:50%;top:64.5%;translate:-50% 0;width:77.27%;height:10.47%;margin:0;z-index:4;pointer-events:none;overflow:hidden;animation:ocultar-mensajes var(--duracion) ease both}
    .mensaje{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--claro);font-family:var(--comedor);font-size:clamp(1.05rem,2.5vw,1.35rem);font-weight:400;line-height:1.35;text-align:center;opacity:0;text-wrap:balance}
    .mensaje--1{animation:mensaje-1 var(--duracion) ease both}.mensaje--2{animation:mensaje-2 var(--duracion) ease both}
    .loader{position:absolute;left:50%;top:84.88%;translate:-50% 0;width:7.95%;aspect-ratio:1;height:auto;margin:0;z-index:6;animation:ocultar-loader var(--duracion) ease both}
    .loader__icon{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform-origin:center;will-change:opacity,transform;animation:loader-transform var(--loader-cycle) linear infinite}
    .loader__icon:nth-of-type(1){animation-delay:calc(var(--loader-step)*0)}.loader__icon:nth-of-type(2){animation-delay:calc(var(--loader-step)*1)}.loader__icon:nth-of-type(3){animation-delay:calc(var(--loader-step)*2)}.loader__icon:nth-of-type(4){animation-delay:calc(var(--loader-step)*3)}.loader__icon:nth-of-type(5){animation-delay:calc(var(--loader-step)*4)}.loader__icon:nth-of-type(6){animation-delay:calc(var(--loader-step)*5)}.loader__icon:nth-of-type(7){animation-delay:calc(var(--loader-step)*6)}.loader__icon:nth-of-type(8){animation-delay:calc(var(--loader-step)*7)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes chente-1{0%,4%{opacity:0;transform:translateY(8px) scale(.94) rotate(-2deg)}6%,10%{opacity:1;transform:none}13%,100%{opacity:0;transform:scale(1.05) rotate(2deg)}}
    @keyframes chente-2{0%,10%{opacity:0;transform:translateX(-8px) scale(.95) rotate(-2deg)}12%,17%{opacity:1;transform:none}20%,100%{opacity:0;transform:translateX(6px) scale(1.04) rotate(2deg)}}
    @keyframes chente-3{0%,17%{opacity:0;transform:translateY(7px) scale(.94) rotate(2deg)}19%,24%{opacity:1;transform:none}27%,100%{opacity:0;transform:scale(1.05) rotate(-2deg)}}
    @keyframes chente-4{0%,24%{opacity:0;transform:translateX(8px) scale(.95) rotate(2deg)}26%,31%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateX(-5px) scale(1.04) rotate(-2deg)}}
    @keyframes chente-final{0%,31%{opacity:0;transform:translateY(10px) scale(.9)}34%,41%{opacity:1;transform:translateY(0) scale(1)}48%,56.5%{opacity:1;transform:translateY(-5%) scale(1)}67%,100%{opacity:1;transform:translateY(calc(100% + clamp(3rem,6vh,5rem))) scale(1)}}
    @keyframes ocultar-chentes{0%,67.5%{visibility:visible}68%,100%{visibility:hidden}}
    @keyframes mostrar-placita{0%,44%{opacity:0;transform:none}47%,100%{opacity:1;transform:none}}
    @keyframes mostrar-comedor{0%,60%{opacity:0;transform:translateY(8px)}62.5%{opacity:.58;transform:translateY(4px)}66%,100%{opacity:1;transform:translateY(0)}}
    @keyframes acomodar-marca{0%,100%{transform:translateY(clamp(.85rem,2.7vh,1.7rem)) scale(.76)}}
    @keyframes activar-oclusor{0%,56.49%{visibility:hidden}56.5%,68.5%{visibility:visible}69%,100%{visibility:hidden}}
    @keyframes mensaje-1{0%,3%{opacity:0;transform:translateY(5px)}6%,19%{opacity:1;transform:none}23%,100%{opacity:0;transform:translateY(-4px)}}
    @keyframes mensaje-2{0%,20%{opacity:0;transform:translateY(5px)}24%,39%{opacity:1;transform:none}43%,100%{opacity:0;transform:translateY(-4px)}}
    @keyframes ocultar-mensajes{0%,42%{height:clamp(3.2rem,8vh,4.5rem);margin-top:clamp(1.5rem,4vh,3rem);opacity:1;visibility:visible}49%,100%{height:0;margin-top:0;opacity:0;visibility:hidden}}
    @keyframes ocultar-loader{0%,62%{opacity:1;visibility:visible}65.99%{opacity:0;visibility:visible}66%,100%{opacity:0;visibility:hidden}}
    @keyframes loader-transform{0%{opacity:0;transform:rotate(0deg) scale(.88)}2%,8%{opacity:1;transform:rotate(0deg) scale(1)}10%,12.4%{opacity:0;transform:rotate(300deg) scale(.9)}12.5%,100%{opacity:0;transform:rotate(300deg) scale(.9)}}
    @media(max-width:38rem){
      .mensaje{font-size:clamp(1rem,4.8vw,1.35rem);line-height:1.35}
      .loader{top:88%;width:10%}
    }
    @media(prefers-reduced-motion:reduce){.chente{transform:none!important}.marca,.logo__placita,.logo__comedor,.loader{animation-timing-function:linear}.loader__icon{animation-name:loader-dissolve}@keyframes loader-dissolve{0%,12.4%{opacity:1;transform:none}12.5%,100%{opacity:0;transform:none}}}
  </style>
</head>

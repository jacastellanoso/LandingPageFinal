<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icono de carga</title>
    <style>
        :root {
            --loader-size: clamp(2.75rem, 7vw, 3.5rem);
            --loader-step: 0.8s;
            --loader-cycle: 6.4s;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background-color: #5f0403;
        }

        .loader {
            position: relative;
            width: var(--loader-size);
            height: var(--loader-size);
            flex: 0 0 var(--loader-size);
            user-select: none;
            -webkit-user-select: none;
        }

        .loader__icon {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transform: rotate(0deg) scale(0.96);
            transform-origin: center;
            animation: loader-transform var(--loader-cycle) linear infinite;
        }

        .loader__icon:nth-of-type(1) { animation-delay: calc(var(--loader-step) * 0); }
        .loader__icon:nth-of-type(2) { animation-delay: calc(var(--loader-step) * 1); }
        .loader__icon:nth-of-type(3) { animation-delay: calc(var(--loader-step) * 2); }
        .loader__icon:nth-of-type(4) { animation-delay: calc(var(--loader-step) * 3); }
        .loader__icon:nth-of-type(5) { animation-delay: calc(var(--loader-step) * 4); }
        .loader__icon:nth-of-type(6) { animation-delay: calc(var(--loader-step) * 5); }
        .loader__icon:nth-of-type(7) { animation-delay: calc(var(--loader-step) * 6); }
        .loader__icon:nth-of-type(8) { animation-delay: calc(var(--loader-step) * 7); }

        @keyframes loader-transform {
            0% { opacity: 0; transform: rotate(0deg) scale(0.96); }
            1.25% { opacity: 1; transform: rotate(0deg) scale(1); }
            8.75% { opacity: 1; transform: rotate(0deg) scale(1); }
            12.5% { opacity: 0; transform: rotate(270deg) scale(0.94); }
            100% { opacity: 0; transform: rotate(270deg) scale(0.94); }
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .loader__icon {
                animation-name: loader-dissolve;
                transform: none;
            }

            @keyframes loader-dissolve {
                0% { opacity: 0; }
                1.25%, 8.75% { opacity: 1; }
                12.5%, 100% { opacity: 0; }
            }
        }
    </style>
</head>
